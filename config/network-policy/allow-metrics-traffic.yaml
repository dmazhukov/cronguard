# Opt-in: not referenced by config/default/kustomization.yaml, so it ships
# only if you add it. Worth adding — /metrics is served over plain HTTP with
# no authn/authz filter (see config/default/metrics_service.yaml), so on a
# cluster with a CNI that enforces NetworkPolicy this is what keeps the
# endpoint from being readable by any pod.
#
# Allows ingress only from namespaces labelled 'metrics: enabled'.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: cronguard
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cronguard
  policyTypes:
    - Ingress
  ingress:
    # This allows ingress traffic from any namespace with the label metrics: enabled
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled  # Only from namespaces with this label
      ports:
        - port: 8080
          protocol: TCP
