apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cronguard
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-service
  namespace: system
spec:
  # Named for what it is, not for a scheme: the manager serves /metrics over
  # plain HTTP unless started with --metrics-secure, and never with an
  # authn/authz filter, so a port named "https" made every ServiceMonitor
  # written against these manifests wrong. Limit who can reach it with a
  # NetworkPolicy (config/network-policy/).
  ports:
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: cronguard
