{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cronguard.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.serviceMonitor.namespace }}
  labels:
    {{- include "cronguard.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "cronguard.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      {{- if dig "secure" false (.Values.metrics | default dict) }}
      # Self-signed, generated when the operator starts: nothing to verify against.
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      honorLabels: {{ .Values.serviceMonitor.honorLabels }}
      # The series carry the monitor's namespace, and prometheus-operator sets
      # a namespace target label of its own (the operator's) that wins the
      # clash: the monitor's lands in exported_namespace. Copy it back, so the
      # alerts and the dashboard read the monitor's namespace; exported_namespace
      # stays, so a Prometheus that enforces its own namespace label afterwards
      # still keeps the monitor's.
      metricRelabelings:
        - sourceLabels: [exported_namespace]
          regex: (.+)
          targetLabel: namespace
          replacement: $1
      {{- if gt (int .Values.replicaCount) 1 }}
      relabelings:
        # HA metrics dedup: skip standby replicas. The Labeler in cmd/main.go
        # writes cronguard.io/role on each pod; only leader=true is scraped,
        # otherwise Prometheus double-counts every cronguard_* gauge.
        - sourceLabels: [__meta_kubernetes_pod_label_cronguard_io_role]
          regex: leader
          action: keep
      {{- end }}
{{- end }}
