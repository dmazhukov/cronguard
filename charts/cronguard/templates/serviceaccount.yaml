{{- /* Charts before 0.2.3 had no serviceAccount block and always created the
account; --reuse-values from them brings no map at all, so absent means true. */}}
{{- $sa := .Values.serviceAccount | default dict }}
{{- if dig "create" true $sa }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cronguard.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronguard.labels" . | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
