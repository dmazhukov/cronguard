apiVersion: v2
name: cronguard
description: SLO-style observability operator for Kubernetes CronJobs
type: application
version: 0.4.1
appVersion: "0.4.1"
kubeVersion: ">=1.28.0-0"
home: https://github.com/dmazhukov/cronguard
sources:
  - https://github.com/dmazhukov/cronguard
keywords:
  - kubernetes
  - operator
  - cronjob
  - prometheus
  - sre
  - slo
  - monitoring
maintainers:
  - name: Dmitrii Zhukov
    email: dmitry0983@gmail.com
    url: https://github.com/dmazhukov
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: fixed
      description: A Job seen running and then failing is counted as a failure; ConsecutiveFailures and ExecutionHealthy missed nearly every real failure before
    - kind: fixed
      description: UnsatisfiableSchedule means the schedule never fires, not that its next slot is more than five years away
    - kind: fixed
      description: next_expected_timestamp_seconds is absent while the operator is not measuring, instead of 0 or a stale value
    - kind: added
      description: --max-concurrent-reconciles and the maxConcurrentReconciles chart value
    - kind: changed
      description: CronGuardOperatorDown uses the namespace matcher only with the chart's ServiceMonitor
    - kind: security
      description: Image and OCI chart signed with cosign; SBOM and Sigstore bundle attached to the release
  artifacthub.io/signKey: |
    fingerprint: D8D23047F2F66F57F4E70514006E990174AB7D61
    url: https://dmazhukov.github.io/cronguard/pgp_keys.asc
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/dmazhukov/cronguard
    - name: OCI
      url: oci://ghcr.io/dmazhukov/charts/cronguard
