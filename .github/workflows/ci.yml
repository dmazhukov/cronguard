name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A repository can go quiet for weeks; a vulnerability disclosure cannot.
  # govulncheck only ever ran on push and PR, so a CVE published against an
  # existing dependency stayed invisible until the next commit — which is
  # exactly how GO-2026-5970 sat undetected in x/text for ten weeks.
  #
  # Note the limit of this remedy: GitHub disables scheduled workflows in a
  # public repository after 60 days with no repository activity, and mails the
  # admin when it does. So this covers a quiet period of up to 60 days, not an
  # unbounded one — which is why workflow_dispatch is here too, as the manual
  # re-arm. Closing the gap properly needs a trigger that does not depend on
  # repository activity.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # prometheus-operator schemas for kubeconform, pinned to one commit of the
  # CRD catalog. Without them kubeconform skips every custom resource, so a
  # typo in a ServiceMonitor or PrometheusRule passes.
  CRD_SCHEMAS: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: Install envtest
        run: make envtest
      - name: Run tests
        run: make test
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cover.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: go build
        run: go build ./...
      - name: docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cronguard:ci
      # Image-level CVE scan. govulncheck (separate job) covers the Go
      # dependency tree only. Trivy adds OS-level scanning of the
      # distroless layer for any glibc / libssl-style CVEs. Severity
      # filter set to HIGH/CRITICAL to keep the gate signal-only;
      # MEDIUM and below produce informational logs that don't fail CI.
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cronguard:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  prometheus-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install promtool
        run: |
          PROM_VERSION=2.55.1
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" | tar -xz
          sudo mv "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/
      - name: Validate rules
        run: |
          # The file is a PrometheusRule CRD; promtool wants bare RuleGroups.
          yq eval '.spec' config/prometheus/rules.yaml | promtool check rules /dev/stdin
      - name: Install kustomize and kubeconform
        run: |
          KUSTOMIZE_VERSION=v5.8.1
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz
          sudo mv kustomize /usr/local/bin/
          KUBECONFORM_VERSION=v0.8.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz
          sudo mv kubeconform /usr/local/bin/
      # config/default is what the release turns into install.yaml;
      # config/observability and config/network-policy are applied next to
      # it. The CRD is dropped before validation because kubeconform has no
      # schema for CustomResourceDefinition; with it gone nothing may be
      # skipped, so a schema the catalog stops serving fails the step.
      - name: Build and validate the kustomize overlays
        run: |
          set -euo pipefail
          for overlay in config/default config/observability config/network-policy; do
            out=$(kustomize build "$overlay" \
              | yq eval 'select(.kind != "CustomResourceDefinition")' - \
              | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -)
            echo "$overlay: $out"
            # an empty stream validates too
            grep -Eq 'Valid: [1-9]' <<<"$out" || { echo "::error::$overlay validated no resources"; exit 1; }
          done

  # Guards that the regenerated outputs of `make manifests generate` match what's
  # checked into the repo. Without this, a contributor changing a kubebuilder
  # marker (e.g., +kubebuilder:validation:Pattern) and forgetting `make
  # manifests` lets the CRD YAML drift from the Go struct silently, which
  # then ships as a broken release. Standard kubebuilder pattern.
  manifests-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: Regenerate
        run: make manifests generate
      - name: Diff
        run: |
          if ! git diff --exit-code config/crd config/rbac api/v1alpha1/zz_generated.deepcopy.go; then
            echo "::error::Generated files are stale. Run 'make manifests generate' locally and commit the result."
            exit 1
          fi
      # The chart ships its own copy of the CRD because Helm installs CRDs from
      # crds/ rather than templates/. That copy is hand-synced and was covered
      # by no gate at all: the diff above looks only at config/. A stale chart
      # copy ships green and users installing via Helm get a schema that does
      # not match the operator's Go types.
      - name: CRD copies in sync
        run: make verify-crd-sync

  # Phase 2 spec §6 acceptance criteria: helm lint + kubeconform on all
  # rendering combinations of the chart. Catches templating errors (typos
  # in {{ .Values.x }}, missing keys, indent regressions) before they reach
  # users.
  chart-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the reuse-values check reads the previous tag's values
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: helm lint
        run: helm lint charts/cronguard
      # A missing signing secret, or one that stopped matching the committed
      # public key, fails here instead of halfway through a release. Fork and
      # Dependabot runs get no secrets.
      - name: sign the chart as a release does
        env:
          HELM_SIGNING_KEY: ${{ secrets.HELM_SIGNING_KEY }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$HELM_SIGNING_KEY" ]; then
            if [ "$EVENT" = pull_request ] || [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "no signing secret in this run, skipped"; exit 0
            fi
            echo "::error::secret HELM_SIGNING_KEY is not set; the next release would fail in its chart job"; exit 1
          fi
          hack/sign-chart.sh 0.0.0-ci /tmp/chart-signed > /dev/null
      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.8.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz
          sudo mv kubeconform /usr/local/bin/
      - name: kubeconform default values
        run: |
          helm template charts/cronguard \
            | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -
      - name: kubeconform — full opt-ins
        run: |
          helm template charts/cronguard \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set replicaCount=2 \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --set metrics.secure=true \
            --set-json 'networkPolicy.metricsFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
            | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -

      # `helm upgrade --reuse-values` renders the new templates against the
      # values of the release being upgraded: Helm replaces the chart's
      # defaults with the old ones (chart.Values = oldVals in
      # pkg/action/upgrade.go) and stores them in the new release, so a user
      # who only ever upgrades this way keeps the defaults of the version they
      # first installed. Render the chart against the values.yaml of every
      # tag that shipped one. A template reading a map those values lack fails
      # the render; no container flag may come out empty, the binary refuses
      # one.
      - name: upgrade from every earlier release with --reuse-values
        run: |
          set -euo pipefail
          for tag in $(git tag -l 'v*' --sort=v:refname); do
            git cat-file -e "${tag}:charts/cronguard/values.yaml" 2>/dev/null || continue
            rm -rf /tmp/reuse && cp -r charts/cronguard /tmp/reuse
            git show "${tag}:charts/cronguard/values.yaml" > /tmp/reuse/values.yaml
            out=$(helm template x /tmp/reuse) || { echo "::error::the chart does not render with the values of $tag"; exit 1; }
            if grep -nE -- '^[[:space:]]*- --[a-z0-9-]+=$' <<<"$out"; then
              echo "::error::an upgrade with --reuse-values from $tag renders an empty flag value"
              exit 1
            fi
            echo "renders with the values of $tag"
          done
      - name: networkPolicy refuses to render without peers
        run: |
          if err=$(helm template x charts/cronguard --set networkPolicy.enabled=true 2>&1 >/dev/null); then
            echo "::error::networkPolicy.enabled with no metricsFrom rendered a policy that admits every source"
            exit 1
          fi
          grep -q 'networkPolicy.metricsFrom must list' <<<"$err" || { echo "::error::failed for another reason: $err"; exit 1; }

  # Backstop for the pre-commit gitleaks hook: hooks are opt-in, can be
  # bypassed with --no-verify, and fork PRs never run them. Scans the commits
  # of the push or pull request for bare-string secrets (dotenvx keys, cloud
  # tokens) that detect-private-key does not recognise.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
